version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - kline-net

  redis:
    image: redis:7-alpine
    container_name: kline-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - kline-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kline-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      AUTO_INVITE_SECRET: ${AUTO_INVITE_SECRET}
      AUTO_INVITE_PREFIX: ${AUTO_INVITE_PREFIX:-INV}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      TENCENT_VOD_APP_ID: ${TENCENT_VOD_APP_ID}
      TENCENT_VOD_PLAYER_SIGN_KEY: ${TENCENT_VOD_PLAYER_SIGN_KEY:-}
      TENCENT_VOD_PLAYER_SIGN_EXPIRES_SECONDS: ${TENCENT_VOD_PLAYER_SIGN_EXPIRES_SECONDS:-7200}
      TENCENT_VOD_URL_EXPIRES_SECONDS: ${TENCENT_VOD_URL_EXPIRES_SECONDS:-7200}
      TENCENT_VOD_URL_RLIMIT: ${TENCENT_VOD_URL_RLIMIT:-3}
      TENCENT_VOD_TRIAL_SECONDS: ${TENCENT_VOD_TRIAL_SECONDS:-0}
      TENCENT_VOD_PLAY_DOMAIN: ${TENCENT_VOD_PLAY_DOMAIN:-}
      TENCENT_VOD_PLAY_SCHEME: ${TENCENT_VOD_PLAY_SCHEME:-https}
      TENCENT_VOD_TRACE_UV: ${TENCENT_VOD_TRACE_UV:-}
      TENCENT_VOD_PLAYER_AUDIO_VIDEO_TYPE: ${TENCENT_VOD_PLAYER_AUDIO_VIDEO_TYPE:-Original}
      TENCENT_VOD_RAW_ADAPTIVE_DEFINITION: ${TENCENT_VOD_RAW_ADAPTIVE_DEFINITION:-0}
      TENCENT_VOD_TRANSCODE_DEFINITION: ${TENCENT_VOD_TRANSCODE_DEFINITION:-0}
      TENCENT_VOD_IMAGE_SPRITE_DEFINITION: ${TENCENT_VOD_IMAGE_SPRITE_DEFINITION:-0}
      TENCENT_VOD_LICENSE_URL: ${TENCENT_VOD_LICENSE_URL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '${API_PORT}'
    volumes:
      - uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - kline-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_ICP_NO: ${NEXT_PUBLIC_ICP_NO}
        NEXT_PUBLIC_ICP_LINK: ${NEXT_PUBLIC_ICP_LINK}
        NEXT_PUBLIC_PSB_NO: ${NEXT_PUBLIC_PSB_NO}
        NEXT_PUBLIC_PSB_LINK: ${NEXT_PUBLIC_PSB_LINK}
    container_name: kline-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: ${WEB_PORT}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_CONTACT_WECHAT_ID: ${NEXT_PUBLIC_CONTACT_WECHAT_ID}
      NEXT_PUBLIC_CONTACT_WECHAT_QR: ${NEXT_PUBLIC_CONTACT_WECHAT_QR}
      NEXT_PUBLIC_ADMIN_WECHAT_ID: ${NEXT_PUBLIC_ADMIN_WECHAT_ID}
      NEXT_PUBLIC_ADMIN_WECHAT_QR: ${NEXT_PUBLIC_ADMIN_WECHAT_QR}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      NEXT_PUBLIC_ICP_NO: ${NEXT_PUBLIC_ICP_NO}
      NEXT_PUBLIC_ICP_LINK: ${NEXT_PUBLIC_ICP_LINK}
      NEXT_PUBLIC_PSB_NO: ${NEXT_PUBLIC_PSB_NO}
      NEXT_PUBLIC_PSB_LINK: ${NEXT_PUBLIC_PSB_LINK}
    depends_on:
      api:
        condition: service_started
    expose:
      - '${WEB_PORT}'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - kline-net

  nginx:
    image: nginx:1.27-alpine
    container_name: kline-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - kline-net

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  kline-net:
    driver: bridge
