version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kline-net

  redis:
    image: redis:7-alpine
    container_name: kline-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kline-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kline-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '${API_PORT}'
    networks:
      - kline-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: kline-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: ${WEB_PORT}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_CONTACT_WECHAT_ID: ${NEXT_PUBLIC_CONTACT_WECHAT_ID}
      NEXT_PUBLIC_CONTACT_WECHAT_QR: ${NEXT_PUBLIC_CONTACT_WECHAT_QR}
      NEXT_PUBLIC_ADMIN_WECHAT_ID: ${NEXT_PUBLIC_ADMIN_WECHAT_ID}
      NEXT_PUBLIC_ADMIN_WECHAT_QR: ${NEXT_PUBLIC_ADMIN_WECHAT_QR}
    depends_on:
      api:
        condition: service_started
    expose:
      - '${WEB_PORT}'
    networks:
      - kline-net

  nginx:
    image: nginx:1.27-alpine
    container_name: kline-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kline-net

volumes:
  pgdata:
  redisdata:

networks:
  kline-net:
    driver: bridge
